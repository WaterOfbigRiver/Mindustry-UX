name: Tests

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Fetch pinned Arc
      run: |
        git init ../Arc
        git -C ../Arc remote add origin https://github.com/Anuken/Arc
        git -C ../Arc fetch --depth=1 origin 7445105cd2683daf5b9ac7033ebb07265d3e814d
        git -C ../Arc checkout FETCH_HEAD
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Run unit tests
      run: ./gradlew tests:test --rerun --stacktrace
