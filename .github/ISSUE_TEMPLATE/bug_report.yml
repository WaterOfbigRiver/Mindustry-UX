name: Bug report
description: Report a problem in the public Mindustry-UX build.
title: "[Bug] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        This tracker covers the **public Mindustry-UX changes only**: the campaign wave timer and the sector Resume / New Game / Restore Previous Save actions.

        - Bugs that also happen in official Mindustry belong in [Anuken/Mindustry](https://github.com/Anuken/Mindustry/issues).
        - Do not attach saves with personal data, credentials, tokens, signing keys, or local absolute paths.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where does the problem happen?
      multiple: false
      options:
        - Windows
        - Linux
        - macOS
        - Android (self-built)
        - Other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version and build
      description: The exact release tag you downloaded, plus the build number shown under the main menu title.
      placeholder: "e.g. v0.1.0-alpha.1, build 1"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: false
      options:
        - Campaign wave timer
        - Sector save / Resume / New Game
        - Restore Previous Save
        - Build or launch
        - Other public change
        - Not sure
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: What happened
      description: Describe the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the exact steps, including the sector, planet, and whether the sector already had a save.
      placeholder: |
        1. Load or start sector ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Mods used
      description: List enabled mods or write "none". Please retry with all mods disabled if possible.
      placeholder: none
    validations:
      required: true

  - type: textarea
    id: save-file
    attributes:
      label: Save or backup file
      description: For save, backup, or restore issues, attach the zipped export from Settings -> Game Data -> Export Data, or the relevant `.msav` file. Remove personal data first.
      placeholder: Required for save, backup, and restore issues.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: For crashes, attach the file from Settings -> Game Data -> Export Crash logs.
    validations:
      required: false

  - type: checkboxes
    id: agreement
    attributes:
      label: Before submitting
      options:
        - label: I am using the latest public prerelease or the latest `public-master` build.
          required: true
        - label: I searched the open and closed issues for the same problem.
          required: true
        - label: This problem is related to a public Mindustry-UX change, not only to official Mindustry.
          required: true
        - label: I have removed personal data, credentials, and local paths from anything I attach.
          required: true
